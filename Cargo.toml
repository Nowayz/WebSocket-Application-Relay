[package]
name = "war-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A bounded Rust port of WebSocket Application Relay with a CBOR protocol"
license = "MIT"
repository = "https://github.com/Nowayz/WebSocket-Application-Relay"
default-run = "war-relay"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
core_affinity = "0.8.3"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = { version = "0.3", features = ["std"] }
minicbor = { version = "2", features = ["std", "half"] }
mio = { version = "1.2.4", features = ["net", "os-poll"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slab = "0.4"
socket2 = { version = "0.6", features = ["all"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time", "io-util"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "load"
path = "examples/load.rs"

[patch.crates-io]
# Narrow decoder-storage control; source versions and patch are in vendor/README.md.
tungstenite = { path = "vendor/tungstenite" }
tokio-tungstenite = { path = "vendor/tokio-tungstenite" }
