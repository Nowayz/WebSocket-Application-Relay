[package]
name = "war-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A bounded WebTransport relay with native CBOR routing"
license = "MIT"
repository = "https://github.com/Nowayz/WebSocket-Application-Relay"
default-run = "war-relay"

[dependencies]
anyhow = "1"
arc-swap = "1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
core_affinity = "0.8.3"
crossbeam-queue = "0.3"
getrandom = { version = "0.3", features = ["std"] }
http = "1"
minicbor = { version = "2", features = ["std", "half"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simdutf8 = "0.1.5"
socket2 = { version = "0.6", features = ["all"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
papaya = "0.2.5"
wtransport = { version = "0.7.2", features = ["quinn"] }
web-transport-quinn = { version = "=0.13.3", default-features = false, features = ["ring"] }

# The QUIC path allocates several small objects per delivery; jemalloc measurably
# outperforms the system allocator there. MSVC targets keep the system allocator.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7"

[dev-dependencies]
url = "2"
futures-util = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
# Protocol storage and QUIC integration patches; pinned origins are in vendor/README.md.
quinn-proto = { path = "vendor/quinn-proto" }
quinn = { path = "vendor/quinn" }
rustls = { path = "vendor/rustls" }
web-transport-quinn = { path = "vendor/web-transport-quinn" }
