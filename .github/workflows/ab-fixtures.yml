name: A/B fixtures
# Run the measurement fixtures against release builds of two refs on one
# runner, alternating the order each repeat, and upload every receipt.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Ref to compare the dispatched ref against
        default: master
      repeats:
        description: Alternating repeats of every workload
        default: '3'
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base }}
          path: base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: toolchain
        run: |
          python3 -c "import tomllib; print('channel=' + tomllib.load(open('candidate/rust-toolchain.toml', 'rb'))['toolchain']['channel'])" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - run: cargo build --release --locked --bins --examples
        working-directory: candidate
      - run: cargo build --release --locked --bins --examples
        working-directory: base
      - run: nproc && lscpu | head -20
      - run: python3 candidate/scripts/ab-fixtures.py --base base --candidate candidate --repeats "${{ inputs.repeats }}" --output artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-fixtures
          path: artifacts/
